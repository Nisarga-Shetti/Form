<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        
        <title>Scholarship Application Form</title>

        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body{
                font-family: Arial, Helvetica, sans-serif;
                min-height: 100vh;
                padding: 40px 20px;
                background: linear-gradient(135deg,#667eea,#764ba2);
            }

            .container{
                max-width: 850px;
                margin: auto;
                background: rgba(255,255,255,0.95);
                padding: 35px;
                border-radius: 20px;
            }

            h1{
                text-align: center;
                color: #4b3f72;
                margin-bottom: 10px;
            }

            .description{
                text-align: center;
                color: #666;
                margin-bottom: 30px;
            }
            
            h2{
                font-size: 20px;
                color: #5a4fcf;
                margin: 25px 0 15px;
                border-bottom: 2px solid #ddd;
                padding-bottom: 8px;
            }

            .subject{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .form-group{
                margin-bottom: 18px;
            }

            label{
                display: block;
                margin-bottom: 7px;
                font-weight: bold;
                color: #333;
            }

            input, select, textarea{
                width: 100%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 15px;
                outline: none;
                transition: 0.3s;
            }

            input:focus,
            select:focus,
            textarea:focus {
                border-color: #667eea;
                box-shadow: 0 0 6px rgba(102, 126, 234, 0.4);
            }

            textarea {
                height: 90px;
                resize: vertical;
            }

            .radio-group {
                display: flex;
                gap: 25px;
                margin-top: 10px;
            }

            .radio-group label {
                font-weight: normal;
            }

            .radio-group input {
                width: auto;
                margin-right: 5px;
            }

            input[type="file"] {
                padding: 10px;
                background: #f5f5f5;
            }

            .declaration {
                background: #f5f6ff;
                padding: 15px;
                border-radius: 10px;
                margin-top: 20px;
            }

            .declaration label {
                font-weight: normal;
            }

            .declaration input {
                width: auto;
                margin-right: 8px;
            }

            .buttons {
                display: flex;
                gap: 15px;
                margin-top: 25px;
            }

            button {
                flex: 1;
                padding: 13px;

                border: none;
                border-radius: 8px;

                font-size: 16px;
                font-weight: bold;

                cursor: pointer;
                transition: 0.3s;
            }

            .submit {
                background: #5a4fcf;
                color: white;
            }

            .reset {
                background: #ddd;
                color: #333;
            }

        </style>
    </head>

    <body>
        <div class="container">
            <h1>Scholarship Application Form</h1>

            <p class="description">
                Please fill in the details carefully to apply for the scholarship.
            </p>

            <form>
                <h2>Student Details</h2>

                <div class="student">
                    
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number">
                    </div>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="other">
                            Other
                        </label>
                    </div>
                </div>

                <h2>Academic Details</h2>

                <div class="student">
                    <div class="form-group">
                        <label for="college">College/Institution</label>
                        <input type="text" id="college" placeholder="Enter college name" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>

                        <select id="course" required>
                            <option value="">Select Course</option>
                            <option>BCA</option>
                            <option>BSC</option>
                            <option>BCOM</option>
                            <option>BE</option>
                            <option>BBA</option>
                            <option>MCA</option>
                            <option>MBA</option>
                        </select>
                    </div>
                </div>

                <div class="student">

                    <div class="form-group">
                        <label for="year">Current Year</label>

                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="percentage">Previous Percentage</label>
                        <input type="number" id="percentage" placeholder="Enter percentage" min="0" max="100" required>
                    </div>
                </div>

                <h2>Financial Details</h2>

                <div class="subject">
                    <div class="form-group">
                        <label for="income">Annual Family Income</label>
                        <input type="number" id="income" placeholder="Enter annual income" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Scholarship Category</label>

                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option>Merit Scholarship</option>
                            <option>Need Based Scholarship</option>
                            <option>Sports Scholarship</option>
                            <option>Minority Scholarship</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <h2>Address Details</h2>
                
                <div class="form-group">
                    <label for="address">Permanent Address</label>

                    <textarea id="address" placeholder="Enter your complete address" required></textarea>
                </div>

                <h2>Upload Documents</h2>

                <div class="subject">

                    <div class="form-group">
                        <label for="marksheet">Previous Marksheet</label>
                        <input type="file" id="marksheet" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>

                    <div class="form-group">
                        <label for="incomecertificate">Income Certificate</label>
                        <input type="file" id="incomecertificate" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>
                </div>

                <div class="declaration">
                    <label>
                        <input type="checkbox" required>
                        I declare that the information provided in this application is true and correct to the best of my knowledge.
                    </label>
                </div>


                <div class="buttons">
                    <button type="reset" class="reset">Reset</button>
                    <button type="submit" class="submit">Apply for Scholarship</button>
                </div>
            </form>
        </div>
    </body>
</html>
